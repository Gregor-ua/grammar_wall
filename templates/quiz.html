<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: {{ card.title if card else card_id }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-image: url('{{ card.bg_image if card and card.bg_image else url_for("static", filename="autumn.jpg") }}');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f5ebe0;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .quiz-container {
            background-color: rgba(24, 16, 14, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 2px solid rgba(239, 68, 68, 0.25);
            box-shadow: 6px 6px 0px #000;
            max-width: 750px;
            width: 100%;
            padding: 40px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(239, 68, 68, 0.25);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .back-link {
            color: #fca5a5;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .back-link:hover {
            text-decoration: underline;
        }

        .card-timer-widget {
            background: rgba(24, 16, 14, 0.85);
            padding: 6px 14px;
            border: 2px solid rgba(239, 68, 68, 0.25);
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #fca5a5;
            font-family: monospace;
            box-shadow: 2px 2px 0px #000;
        }

        h1 {
            color: #f5ebe0;
            margin: 15px 0 5px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }

        .question-card {
            background: rgba(15, 10, 8, 0.7);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .question-title {
            font-size: 18px;
            font-weight: 600;
            color: #f5ebe0;
            margin-bottom: 15px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            background: rgba(24, 16, 14, 0.9);
            border: 1.5px solid rgba(239, 68, 68, 0.25);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #d6d3d1;
        }

        .option-label:hover {
            border-color: #ef4444;
            background-color: rgba(42, 27, 22, 0.9);
            color: #fff;
        }

        .option-label input {
            margin-right: 12px;
            accent-color: #ef4444;
        }

        .btn-submit {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            color: white;
            border: 2px solid #b91c1c;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            box-shadow: 3px 3px 0px #000;
            transition: 0.1s;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
        }
        .btn-submit:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid rgba(239, 68, 68, 0.4);
            box-shadow: 4px 4px 0px #000;
        }

        .result-box.success {
            background-color: rgba(20, 56, 43, 0.9);
            color: #6ee7b7;
            border-color: #059669;
        }

        .result-box.warning {
            background-color: rgba(69, 26, 3, 0.9);
            color: #fcd34d;
            border-color: #d97706;
        }

        .btn-to-board {
            display: inline-block;
            margin-top: 15px;
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #b91c1c;
            box-shadow: 3px 3px 0px #000;
            transition: 0.1s;
        }

        .btn-to-board:hover {
            filter: brightness(1.1);
        }

        .btn-to-board:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        #time-up-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .time-up-modal {
            background: #181614;
            padding: 40px;
            border-radius: 16px;
            border: 3px solid rgba(239, 68, 68, 0.4);
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 6px 6px 0px #000;
        }

        .time-up-modal h2 {
            color: #ef4444;
            margin-top: 0;
            font-size: 24px;
        }

        .time-up-modal p {
            font-size: 18px;
            color: #f5ebe0;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .time-up-modal a {
            display: inline-block;
            background: #ef4444;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #b91c1c;
            box-shadow: 3px 3px 0px #000;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <a href="{% if card_id == 'exam_matrix' %}/board{% else %}/card/{{ card_id }}{% endif %}" class="back-link">← Назад до картки</a>
        <div class="card-timer-widget">
            ⏱️ <span id="card-timer-display">02:00</span>
        </div>
    </div>

    <h1>Тест: {{ card.title if card else card_id }}</h1>

    <form id="quizForm">
        {% for q in questions %}
        <div class="question-card">
            <div class="question-title">{{ loop.index }}. {{ q.question }}</div>
            <div class="options">
                {% for option in q.options %}
                <label class="option-label">
                    <input type="radio" name="q{{ q.id }}" value="{{ option }}">
                    {{ option }}
                </label>
                {% endfor %}
            </div>
        </div>
        {% endfor %}

        <button type="button" class="btn-submit" onclick="checkAnswers()">Завершити тест</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<div id="time-up-overlay">
    <div class="time-up-modal">
        <h2>⏱️ Час вичерпано!</h2>
        <p>Час закінчився, на сьогодні досить.</p>
        <a href="{% if card_id == 'exam_matrix' %}/board{% else %}/card/{{ card_id }}{% endif %}">Повернутися до картки</a>
    </div>
</div>

<script>
    const answersMap = {{ answers_map | tojson }};

    function checkAnswers() {
        let score = 0;
        const total = Object.keys(answersMap).length;

        Object.keys(answersMap).forEach((qId) => {
            const selected = document.querySelector(`input[name="q${qId}"]:checked`);
            if (selected && selected.value === answersMap[qId]) {
                score++;
            }
        });

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';

        const passThreshold = total >= 20 ? 18 : 7;

        if (score >= passThreshold) {
            resultBox.className = 'result-box success';
            resultBox.innerHTML = `
                Чудовий результат! Ви відповіли правильно на ${score} з ${total} питань. 🎉<br>
                <a href="/board" class="btn-to-board">✅ Перевірка пройдена — на стіну</a>
            `;

            fetch('/api/save_score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ card_id: "{{ card_id }}", score: score })
            });

        } else {
            resultBox.className = 'result-box warning';
            resultBox.innerHTML = `Ваш результат: ${score} з ${total}. Потрібно мінімум ${passThreshold} балів. Рекомендуємо повторити правило! 📚`;
        }
    }

    function updateCardTimer() {
        let isRunning = localStorage.getItem("study_timer_running_2min") === "true";
        let endTime = localStorage.getItem("study_end_time_2min");
        let display = document.getElementById("card-timer-display");

        if (!isRunning || !endTime) {
            if (display) display.textContent = "02:00";
            return;
        }

        let timeLeft = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        if (display) {
            display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        if (timeLeft <= 0) {
            localStorage.setItem("study_timer_running_2min", "false");
            localStorage.removeItem("study_end_time_2min");
            document.getElementById("time-up-overlay").style.display = "flex";
        }
    }

    setInterval(updateCardTimer, 1000);
    updateCardTimer();
</script>

</body>
</html>
